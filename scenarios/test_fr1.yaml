environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 8
    nrow: 8
    frequency_hz: 3.9e9
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 2

  - step: "Config All Zeros"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "zeros"
      apply_to: "both"
    delay_after: 2

  - step: "Random Config"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "random"
      apply_to: "both"
    delay_after: 2

  - step: "Shutdown"
    action: "power_off"