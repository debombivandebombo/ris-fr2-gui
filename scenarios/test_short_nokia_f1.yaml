environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 8
    nrow: 8
    frequency_hz: 3750.0e6
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"
    # --- POSICIONES GENÉRICAS / REALES ---
    tx_pos: [3.38, 3.53, 0]  # TX físico real
    rx_pos: [7, 0, -0.25]   # RX físico real (para pasos estáticos)

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 2

  - step: "Config All Zeros"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "zeros"
      apply_to: "both"
    delay_after: 120

  - step: "Optimization Case 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "direct_disc"
    delay_after: 120

  - step: "Optimization Case 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "grid_search"
    delay_after: 120

  - step: "Optimization Case 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "1d_search"
    delay_after: 120



  - step: "Sweep Rx El_92"
    action: "sweep"
    params:
      sweep_target: "rx"
      axis: "azimuth"
      start_angle: -60.0
      stop_angle: 60.0
      step_angle: 5.0
      distance: 7
      fixed_angle: 92.0 # other angle not swept (i.e. elevation in this example)
      dwell_time: 120
      
