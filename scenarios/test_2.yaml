environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 40
    nrow: 40
    frequency_hz: 28500.120e6
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 2

  - step: "Config All Zeros"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "zeros"
      apply_to: "both"
    delay_after: 30

  - step: "Optimization Case 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      wave_model: "spherical"
      tx_pos: [21, 0.0, 0.0]
      rx_pos: [4, 3.7, 0.0]
      optimizer: "direct_disc"
    delay_after: 60
  
  - step: "Optimization BS 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      wave_model: "spherical"
      tx_pos: [21, 0.0, 0.0]
      rx_pos: [4, 3.7, 0.0]
      optimizer: "direct_disc"
    delay_after: 60

  - step: "Shutdown"
    action: "power_off"