environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 8
    nrow: 8
    frequency_hz: 3.9e9
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"
    # --- POSICIONES GENÉRICAS / REALES ---
    tx_pos: [3.53, 2.50, 0.0]  # TX físico real
    rx_pos: [5.3, 0.0, -0.4]   # RX físico real (para pasos estáticos)

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 10

  - step: "Config All Zeros"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "zeros"
      apply_to: "both"
    delay_after: 60

  - step: "Optimization"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "direct_disc"
    delay_after: 60


  - step: "Sweep Rx"
    action: "sweep"
    params:
      sweep_target: "rx"
      axis: "azimuth"
      start_angle: -40.0
      stop_angle: 40.0
      step_angle: 10.0
      distance: 5.3
      fixed_angle: 94.3 # other angle not swept (i.e. elevation in this example)
      dwell_time: 60
      
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "direct_disc"





  - step: "Shutdown"
    action: "power_off"