environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 40
    nrow: 40
    frequency_hz: 28.5e9
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9
      
    # Spacing (Optional, defaults to lambda/2 if omitted)
    delta_h: 0.00526
    delta_v: 0.00526

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 2

  - step: "Calibration (All Zeros)"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "zeros"
      apply_to: "both"
    delay_after: 5

  - step: "Optimization Case 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "v"
      wave_model: "plane"
      tx_pos: [-5.0, 0.0, 1.0]
      rx_pos: [5.0, 0.0, 1.0]
      optimizer: "grid_search"
    delay_after: 10

  - step: "Shutdown"
    action: "power_off"