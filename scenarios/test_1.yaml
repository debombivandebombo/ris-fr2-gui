environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 40
    nrow: 40
    frequency_hz: 28500.120e6
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"
    # --- POSICIONES GENÉRICAS / REALES ---
    tx_pos: [1.5, 0.8, 0]  # TX físico real
    rx_pos: [1.9, 0.0, 0]   # RX físico real (para pasos estáticos)

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 2

  - step: "Config All Zeros"
    action: "configure"
    # Ahora agrupados en params
    params:
      conf_mode: "zeros"
      apply_to: "both"
    delay_after: 3

  - step: "Optimization Case 1"
    action: "configure"
    params:
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "direct_disc"
    delay_after: 3

  # - step: "Short Sweep (3 Points)"
    # action: "sweep"
    # params:
      # sweep_target: "rx"
      # axis: "azimuth"
      # start_angle: -10.0
      # stop_angle: 10.0
      # step_angle: 10.0  # -10, 0, 10 (3 puntos)
      # distance: 2
      # fixed_angle: 90.0 # other angle not swept (i.e. elevation in this example)
      # dwell_time: 30
      
      # conf_mode: "optimize"
      # apply_to: "both"
      # optimizer: "direct_disc"

  - step: "Sweep (test_ris_bf)"
    action: "sweep"
    params:
      sweep_target: "rx"
      axis: "azimuth"
      start_angle: -5.0
      stop_angle: 5.0
      step_angle: 1.0  
      distance: 1.9
      fixed_angle: 90.0 # other angle not swept (i.e. elevation in this example)
      dwell_time: 3
      
      conf_mode: "optimize"
      apply_to: "both"
      optimizer: "direct_disc"

  - step: "Shutdown"
    action: "power_off"