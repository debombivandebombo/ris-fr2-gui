environment:
  ris_params:
    name: "RIS_Lab_Test"
    center: [0.0, 0.0, 0.0]
    boresight: "x" # String requerido
    ncol: 8
    nrow: 8
    frequency_hz: 3750.0e6
    
    # 1 Bit Configuration (Optional explicitly defined)
    num_bits: 1
    phase_shifts_dict:
      0: 0.0
      1: 3.14159
    att_dict:
      0: 0.9
      1: 0.9

  defaults:
    tx_gain: 16
    rx_gain: 16
    wave_model: "spherical"
    # --- POSICIONES GENÉRICAS / REALES ---
    tx_pos: [6.3, 0, 0]  # TX físico real
    rx_pos: [4.30, 3.7, 0]   # RX físico real (para pasos estáticos)

timeline:
  - step: "Initialization"
    action: "power_on"
    delay_after: 2

  # - step: "Config All Zeros"
